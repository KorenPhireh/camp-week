<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14112a">
<title>Blob Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14112a;--panel:rgba(33,28,63,.94);--panel2:#2f2858;--ink:#fff;--mute:#aaa3d6;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;font-weight:600;color:#fff;background:var(--panel2);transition:transform .08s,filter .15s}
button:hover{filter:brightness(1.15)}button:active{transform:translateY(2px) scale(.98)}
button:disabled{opacity:.45;cursor:not-allowed}
input{font:inherit;font-weight:600;width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#16122e;color:#fff;outline:none;font-size:18px}
input:focus{border-color:#9b7bff}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 6px}
.big{font-size:20px;padding:15px 20px;width:100%;margin-top:12px}
.primary{background:linear-gradient(135deg,#ff5d73,#ffb84d);color:#3a0d18;box-shadow:0 5px 0 #a33349}
.blue{background:linear-gradient(135deg,#4da3ff,#9b7bff);box-shadow:0 5px 0 #3a3a9e}
.green{background:linear-gradient(135deg,#2ecc71,#7be27b);color:#0b2a14;box-shadow:0 5px 0 #1d7a44}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,17,42,.45),rgba(10,8,24,.88));overflow:auto;padding:16px;touch-action:pan-y}
.card{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:26px;border:2px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.menu-card{width:min(900px,100%);padding:24px 26px;margin:auto}
.logo{font-size:clamp(46px,9vw,84px);font-weight:700;line-height:.9;text-align:center;letter-spacing:.02em;background:linear-gradient(90deg,#ff5d73,#ffb84d,#ffe156,#7be27b,#4da3ff,#9b7bff,#ff7bd5);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 6s linear infinite;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
@keyframes hue{to{background-position:200% 0}}
.tag{text-align:center;color:var(--mute);margin:8px 0 6px;font-size:16px}
.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:26px}
@media(max-width:740px){.cols{grid-template-columns:1fr;gap:6px}.menu-card{padding:18px}}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid rgba(0,0,0,.25);cursor:pointer;transition:transform .1s}
.sw.on{border-color:#fff;transform:scale(1.15);box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:999px;background:#16122e;border:2px solid var(--line);font-size:14px;font-weight:600}
.chip.on{background:#9b7bff;border-color:#c9b8ff;color:#fff}
.seg{display:flex;gap:6px}.seg .chip{flex:1;text-align:center}
.small{font-size:13px;color:var(--mute);margin-top:8px;line-height:1.4}
.joinrow{display:flex;gap:8px;margin-top:14px}
.joinrow input{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-size:22px}
.joinrow button{min-width:100px;font-size:18px}
#preview{display:block;margin:4px auto 0;width:200px;height:150px}
.msg{min-height:22px;margin-top:12px;font-weight:600;color:#ffe156;text-align:center}
.help{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--mute);text-align:center;line-height:1.6}
kbd{background:#16122e;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 6px;font-family:inherit;font-size:12px;color:#fff}
#lobby{position:fixed;right:12px;top:12px;width:330px;max-height:calc(100% - 24px);overflow:auto;padding:16px;touch-action:pan-y}
#lobby.min{height:auto;overflow:hidden;bottom:auto!important;top:8px!important;width:auto!important;left:auto!important}
#lobby.min .lb-body{display:none}
.lb-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lb-head h3{margin:0;font-size:20px}
.code{font-size:40px;font-weight:700;letter-spacing:.18em;text-align:center;background:#16122e;border-radius:16px;padding:6px 0;margin:10px 0 8px;color:#ffe156}
.pl{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.04);margin-bottom:5px;font-weight:600}
.pl i{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid rgba(0,0,0,.3)}
.pl span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl em{font-style:normal;font-size:11px;padding:2px 6px;border-radius:6px;background:#3d3570;color:#d6ccff}
.pl em.you{background:#ffe156;color:#3a2d00}
.pl button{padding:2px 8px;border-radius:8px;font-size:13px;background:#4a2238}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.start{font-size:22px;padding:14px;width:100%;margin-top:14px}
.wait{text-align:center;color:var(--mute);margin-top:14px;font-weight:600;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media(max-width:740px){#lobby{left:64px;right:8px;top:auto;bottom:8px;width:auto;max-height:52%}}
@media(max-width:740px),(max-height:500px){body.lb-open #dashBtn{display:none!important}}
@media(max-height:500px){#lobby{top:8px;bottom:8px;right:8px;left:auto;width:290px;max-height:none;padding:12px}.code{font-size:30px;margin:6px 0}}
#gear{position:fixed;left:10px;bottom:10px;width:46px;height:46px;padding:0;border-radius:50%;font-size:22px;background:rgba(33,28,63,.85);border:2px solid var(--line)}
#gearMenu{position:fixed;left:10px;bottom:64px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:210px}
#gearMenu button{text-align:left}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:9}
#toast div{background:rgba(20,16,42,.95);border:2px solid var(--line);padding:9px 16px;border-radius:14px;font-weight:600;animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
#dashBtn{position:fixed;right:max(22px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;font-size:20px;background:radial-gradient(circle at 35% 30%,#ff8fa0,#ff5d73 60%,#c23a52);box-shadow:0 6px 0 #8a2338,0 0 0 4px rgba(255,255,255,.15);color:#fff;touch-action:none}
#rotate{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:rgba(20,16,42,.9);padding:8px 14px;border-radius:12px;font-size:14px;pointer-events:none}
@media(orientation:landscape){#rotate{display:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu">
  <div class="card menu-card">
    <div class="logo">BLOB PARTY</div>
    <div class="tag">7 chaotic minigames · 1–12 players · online with friends, on one couch, or vs bots</div>
    <div class="cols">
      <div>
        <label for="nameIn">Your name</label>
        <input id="nameIn" maxlength="14" autocomplete="off" spellcheck="false">
        <label>Color</label>
        <div class="swatches" id="sw"></div>
        <label>Hat</label>
        <div class="chips" id="hats"></div>
        <label>Players on this device</label>
        <div class="seg" id="locals"></div>
        <div class="small" id="devHelp"></div>
      </div>
      <div>
        <canvas id="preview" width="400" height="300"></canvas>
        <button class="big primary" id="hostBtn">🌐 Host an online party</button>
        <div class="joinrow">
          <input id="codeIn" placeholder="CODE" maxlength="4" autocomplete="off" spellcheck="false">
          <button class="blue" id="joinBtn">Join</button>
        </div>
        <button class="big green" id="offBtn">🛋️ Play offline (couch + bots)</button>
        <div class="msg" id="menuMsg"></div>
      </div>
    </div>
    <div class="help">
      Move <kbd>WASD</kbd> <kbd>Arrows</kbd> or a gamepad stick · Dash <kbd>Space</kbd> <kbd>Enter</kbd> or <kbd>A</kbd><br>
      On phones: drag the left side to move, tap the right side to dash
    </div>
  </div>
</div>

<div id="lobby" class="card hidden"></div>
<button id="gear" class="hidden" title="Menu">⚙️</button>
<div id="gearMenu" class="card hidden"></div>
<div id="toast"></div>
<button id="dashBtn" class="hidden">DASH</button>
<div id="rotate" class="hidden">↻ Turn your phone sideways for a bigger view</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
/* ================================================================
   BLOB PARTY: host-authoritative multiplayer party game.
   One machine hosts (runs the simulation); others connect via
   PeerJS (WebRTC) using a 4-letter room code and send inputs.
   ================================================================ */

// ---------- constants & utils ----------
const $ = s => document.querySelector(s);
const W = 1600, H = 900, CX = 800, CY = 450, PR = 24, DT = 1 / 60, DASHV = 980, MAXP = 12, INTRO = 4.5;
const PREFIX = 'blobparty-v1-';
const COLORS = ['#ff5d73', '#ff8c42', '#ffe156', '#7be27b', '#2ecc71', '#3ddbd9', '#4da3ff', '#9b7bff', '#ff7bd5', '#f2f2f2', '#b0835a', '#e8344a'];
const HATS = ['none', 'party', 'cap', 'tophat', 'horns', 'halo', 'bow', 'antenna'];
const HAT_LABEL = { none: 'None', party: '🎉 Party', cap: '🧢 Cap', tophat: '🎩 Top hat', horns: '😈 Horns', halo: '😇 Halo', bow: '🎀 Bow', antenna: '📡 Antenna' };
const BOT_NAMES = ['Bloberto', 'Sir Wobble', 'Gloopy', 'Jelly Jim', 'Squishy', 'Mr. Bounce', 'Goober', 'Puddles', 'Wiggles', 'Blorp', 'Dr. Goo', 'Mochi'];
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const hyp = Math.hypot;
const TAU = Math.PI * 2;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function norm(x, y) { const l = hyp(x, y); return l > 1e-6 ? [x / l, y / l] : [0, 0]; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const store = {
  get(k, d) { try { const v = localStorage.getItem('bp_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('bp_' + k, JSON.stringify(v)); } catch (e) {} }
};
function rgb(hex) { const c = parseInt(hex.slice(1), 16); return [c >> 16, c >> 8 & 255, c & 255]; }
function shade(hex, amt) {
  let [r, g, b] = rgb(hex);
  if (amt < 0) { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; } else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}
function mixHex(h1, h2, t) { const a = rgb(h1), b = rgb(h2); return '#' + a.map((v, i) => Math.round(lerp(v, b[i], t)).toString(16).padStart(2, '0')).join(''); }
function hexA(hex, a) { const [r, g, b] = rgb(hex); return `rgba(${r},${g},${b},${a})`; }
function seeded(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function cleanName(n) { n = String(n || '').replace(/[\u0000-\u001f]/g, '').trim().slice(0, 14); return n || 'Blob'; }

// ---------- audio ----------
let AC = null, muted = store.get('muted', false);
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type = 'square', v = .08, f2) {
  const a = ac(); if (!a || muted) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .03);
}
let noiseBuf = null;
function noise(d, v = .15, fq = 1000, fq2) {
  const a = ac(); if (!a || muted) return;
  if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(fq, t);
  if (fq2) f.frequency.exponentialRampToValueAtTime(fq2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t + d + .03);
}
const SFX = {
  dash: () => noise(.16, .05, 3000, 600),
  hit: () => { tone(160, .14, 'sine', .3, 50); noise(.08, .1, 1800); },
  coin: () => { tone(988, .05, 'square', .04); setTimeout(() => tone(1319, .12, 'square', .04), 55); },
  bigcoin: () => [988, 1319, 1568, 1976].forEach((f, i) => setTimeout(() => tone(f, .1, 'square', .045), i * 55)),
  boom: () => { noise(.7, .35, 900, 60); tone(90, .55, 'sine', .35, 28); },
  infect: () => { tone(220, .32, 'sawtooth', .06, 70); tone(160, .32, 'square', .03, 60); },
  fall: () => tone(700, .7, 'sine', .1, 60),
  elim: () => tone(330, .45, 'triangle', .12, 90),
  pass: () => tone(500, .09, 'triangle', .12, 1000),
  splat: () => noise(.1, .06, 1400),
  beep: () => tone(660, .14, 'square', .06),
  go: () => { tone(1320, .35, 'square', .06); tone(990, .35, 'square', .04); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .2, 'square', .05), i * 110)),
  champ: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => setTimeout(() => tone(f, .22, 'square', .05), i * 130)),
  zone: () => tone(440, .25, 'sine', .07, 880),
  join: () => { tone(660, .08, 'sine', .08); setTimeout(() => tone(880, .12, 'sine', .08), 80); },
};

// ---------- input ----------
const keys = new Set();
const dev = { kb1: { mx: 0, my: 0, dc: 0 }, kb2: { mx: 0, my: 0, dc: 0 }, touch: { mx: 0, my: 0, dc: 0 } };
for (let i = 0; i < 4; i++) dev['pad' + i] = { mx: 0, my: 0, dc: 0, prev: false };
const KB1_DASH = ['Space', 'ShiftLeft', 'KeyE', 'KeyF'], KB2_DASH = ['Enter', 'NumpadEnter', 'ShiftRight', 'Numpad0', 'Slash', 'Period'];
addEventListener('keydown', e => {
  if (e.target instanceof HTMLInputElement) { if (e.code === 'Enter' && e.target.id === 'codeIn') $('#joinBtn').click(); return; }
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  ac();
  if (e.repeat) return;
  keys.add(e.code);
  if (KB1_DASH.includes(e.code)) dev.kb1.dc++;
  if (KB2_DASH.includes(e.code)) dev.kb2.dc++;
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
function kbVec(u, d, l, r) { return [(keys.has(r) ? 1 : 0) - (keys.has(l) ? 1 : 0), (keys.has(d) ? 1 : 0) - (keys.has(u) ? 1 : 0)]; }
function pollDevices() {
  [dev.kb1.mx, dev.kb1.my] = kbVec('KeyW', 'KeyS', 'KeyA', 'KeyD');
  [dev.kb2.mx, dev.kb2.my] = kbVec('ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight');
  let pads = [];
  try { pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : []; } catch (e) {}
  for (let i = 0; i < 4; i++) {
    const d = dev['pad' + i], g = pads[i]; d.mx = 0; d.my = 0;
    if (!g) continue;
    let x = g.axes[0] || 0, y = g.axes[1] || 0;
    if (hyp(x, y) < .22) { x = 0; y = 0; }
    const b = k => g.buttons[k] && g.buttons[k].pressed;
    if (b(14)) x = -1; if (b(15)) x = 1; if (b(12)) y = -1; if (b(13)) y = 1;
    d.mx = x; d.my = y;
    const dn = [0, 1, 2, 3, 4, 5, 6, 7].some(b);
    if (dn && !d.prev) { d.dc++; ac(); }
    d.prev = dn;
  }
}
let numLocal = clamp(store.get('locals', 1), 1, 4);
function devicesFor(i, n) {
  if (n === 1) return ['kb1', 'kb2', 'touch', 'pad0', 'pad1', 'pad2', 'pad3'];
  if (n === 2) return [['kb1', 'touch', 'pad0'], ['kb2', 'pad1']][i];
  return [['kb1', 'touch'], ['kb2'], ['pad0'], ['pad1']][i];
}
const DEV_HELP = {
  1: 'Use keyboard, a gamepad, or touch.',
  2: 'P1: WASD + Space (or gamepad 1) · P2: Arrows + Enter (or gamepad 2)',
  3: 'P1: WASD + Space · P2: Arrows + Enter · P3: gamepad 1',
  4: 'P1: WASD + Space · P2: Arrows + Enter · P3: gamepad 1 · P4: gamepad 2'
};
function localInput(i) {
  let mx = 0, my = 0, dc = 0;
  for (const k of devicesFor(i, numLocal) || []) { const d = dev[k]; mx += d.mx; my += d.my; dc += d.dc; }
  const l = hyp(mx, my); if (l > 1) { mx /= l; my /= l; }
  return [Math.round(mx * 100) / 100, Math.round(my * 100) / 100, dc];
}

// touch controls
const cv = $('#c'), ctx = cv.getContext('2d');
const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
let touchMode = false;
function enableTouch() { if (!touchMode) { touchMode = true; updateUI(); } }
cv.addEventListener('touchstart', e => {
  e.preventDefault(); enableTouch(); ac();
  for (const t of e.changedTouches) {
    if (t.clientX < innerWidth * .55) { if (joy.id == null) { joy.id = t.identifier; joy.ox = t.clientX; joy.oy = t.clientY; joy.x = joy.y = 0; } }
    else dev.touch.dc++;
  }
}, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === joy.id) {
    let dx = t.clientX - joy.ox, dy = t.clientY - joy.oy; const l = hyp(dx, dy), R = 55;
    if (l > R) { joy.ox += dx * (1 - R / l); joy.oy += dy * (1 - R / l); dx *= R / l; dy *= R / l; }
    dev.touch.mx = dx / R; dev.touch.my = dy / R; joy.x = dx; joy.y = dy;
  }
}, { passive: false });
const endTouch = e => { for (const t of e.changedTouches) if (t.identifier === joy.id) { joy.id = null; dev.touch.mx = dev.touch.my = 0; } };
cv.addEventListener('touchend', endTouch); cv.addEventListener('touchcancel', endTouch);
$('#dashBtn').addEventListener('touchstart', e => { e.preventDefault(); dev.touch.dc++; ac(); }, { passive: false });
$('#dashBtn').addEventListener('mousedown', () => { dev.touch.dc++; });

/* ================================================================
   HOST SIMULATION
   ================================================================ */
let G = null;
const LOBBY_CFG = { speed: 310, grip: 10, walls: true, knock: 520, dashCd: .9 };
const GHOST_CFG = { speed: 280, grip: 8, walls: true, knock: 0, dashCd: .8 };
const GC = 40, GR = 22, TS = 40, GY = (H - GR * TS) / 2;

function newGame(o = {}) {
  G = {
    attract: !!o.attract, code: '', phase: 'lobby', t: 0, clock: 0, tick: 0, mode: null, ms: {}, round: 0, order: [],
    players: new Map(), nextId: 1, ev: [], netEv: [], out: [], part: [], res: null, lastCount: 0,
    settings: { rounds: 5, modes: Object.fromEntries(Object.keys(MODES).map(k => [k, true])) },
    rosterDirty: true, rosterAt: 0, last: performance.now(), acc: 0, sendCtr: 0
  };
}
function ev(k, x = 0, y = 0, a = 0) { G.ev.push([k, Math.round(x), Math.round(y), a]); }
function roundPlayers() { const r = []; for (const id of G.part) { const p = G.players.get(id); if (p) r.push(p); } return r; }
function standing() { const r = []; for (const p of G.players.values()) if (p.alive && p.fall <= 0) r.push(p); return r; }

function addPlayer(o) {
  if (G.players.size >= MAXP) return null;
  const used = new Set([...G.players.values()].map(p => p.slot)); let slot = 0; while (used.has(slot)) slot++;

    const link = location.href.split(/[?#]/)[0] + '?join=' + V.code;
    const done = () => toast('Invite link copied!');
    if (navigator.clipboard) navigator.clipboard.writeText(link).then(done, () => prompt('Copy this link:', link)); else prompt('Copy this link:', link);
    return;
  }
  if (!G || (appMode !== 'host' && appMode !== 'offline')) return;
  if (b.id === 'addBot') { if (G.players.size < MAXP) addBot(); }

  else if (b.dataset.rounds) { G.settings.rounds = +b.dataset.rounds; G.rosterDirty = true; }
  else if (b.dataset.mode) {
    const k = b.dataset.mode; G.settings.modes[k] = !G.settings.modes[k];
    if (!MODE_KEYS.some(m => G.settings.modes[m])) G.settings.modes[k] = true;
    G.rosterDirty = true;
  } else if (b.id === 'startBtn') { if (G.phase === 'lobby') startMatch(); }
});
function renderGear() {
  const isHost = appMode === 'host' || appMode === 'offline';
  let h = `<button data-g="sound">${muted ? '🔇 Sound: off' : '🔊 Sound: on'}</button><button data-g="fs">⛶ Fullscreen</button>`;
  if (isHost && V.ph !== 'lobby') h += `<button data-g="lobby">🏠 End match → lobby</button>`;
  h += `<button data-g="leave">🚪 Leave party</button>`;
  $('#gearMenu').innerHTML = h;
}
$('#gear').onclick = () => { renderGear(); $('#gearMenu').classList.toggle('hidden'); };
$('#gearMenu').addEventListener('click', e => {
  const g = e.target.closest('button') && e.target.closest('button').dataset.g; if (!g) return;
  if (g === 'sound') { muted = !muted; store.set('muted', muted); renderGear(); return; }
  if (g === 'fs') { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (er) {} }
  if (g === 'lobby' && G) toLobby();
  if (g === 'leave') { if (appMode !== 'host' || confirm('Leave? This ends the party for everyone.')) backToMenu(); }
  $('#gearMenu').classList.add('hidden');
});
function updateUI() {
  const inGame = appMode !== 'menu' && appMode !== 'joining';
  $('#gear').classList.toggle('hidden', !inGame);
  if (!inGame) $('#gearMenu').classList.add('hidden');
  $('#dashBtn').classList.toggle('hidden', !(inGame && touchMode));
  $('#rotate').classList.toggle('hidden', !(inGame && touchMode));
  renderLobby();
}

// menu blob preview
const pv = $('#preview'), pctx = pv.getContext('2d');
function drawPreview(t) {
  const c = pctx; c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, pv.width, pv.height);
  c.setTransform(2.6, 0, 0, 2.6, pv.width / 2, pv.height / 2 + 30);
  const face = Math.sin(t * .8) * .9 + Math.PI / 2;
  drawBlob(c, { id: 1, x: 0, y: Math.sin(t * 3) * 4 - 6, vx: 0, vy: 0, f: 1, face, color: prof.color, hat: prof.hat, fa: 0 }, t);
  c.setTransform(1, 0, 0, 1, 0, 0); c.textAlign = 'center'; c.font = `700 30px ${FONT}`;
  c.lineWidth = 6; c.strokeStyle = 'rgba(10,8,24,.8)'; c.strokeText(prof.name, pv.width / 2, 42); c.fillStyle = '#fff'; c.fillText(prof.name, pv.width / 2, 42);
}

// ---------- main loop ----------
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - lastFrame) / 1000); lastFrame = now;
  pollDevices();
  if (appMode === 'client') {
    clientInterp(now, dt);
    if (hostConn && hostConn.open) {
      if (now - inputAt > 33) { inputAt = now; try { hostConn.send({ t: 'i', l: V.myIds.map((_, i) => localInput(i)) }); } catch (e) {} }
      if (now - pingAt > 2000) { pingAt = now; try { hostConn.send({ t: 'p', c: now }); } catch (e) {} }
    }
  }
  updateFX(dt);
  render(now, dt);
  if (!$('#menu').classList.contains('hidden')) drawPreview(now / 1000);
}
buildMenu();
startAttract();
if (matchMedia('(pointer:coarse)').matches) touchMode = true;
requestAnimationFrame(frame);
</script>
</body>
